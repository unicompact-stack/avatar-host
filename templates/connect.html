<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подключение — Аватар-хост</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(circle at 20% 10%, #14314a, #0b1622 60%);
    color: #e8eef5;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: min(420px, 92vw);
    background: #12202e;
    border: 1px solid #24384c;
    border-radius: 20px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
  }
  h1 {
    margin: 0 0 8px; font-size: 28px; font-weight: 600;
    text-align: center;
  }
  .subtitle {
    margin: 0 0 24px; font-size: 14px; color: #8fa3b8;
    text-align: center;
  }
  label {
    display: block; font-size: 13px; color: #b9c7d6;
    margin: 0 0 6px;
  }
  input[type=text] {
    width: 100%; padding: 14px 16px; font-size: 16px;
    background: #0d1a26; color: #e8eef5;
    border: 1px solid #24384c; border-radius: 12px;
    margin-bottom: 16px;
  }
  input[type=text]:focus { outline: none; border-color: #3b82f6; }
  .code-input {
    text-align: center; letter-spacing: 0.35em;
    font-weight: 900; font-size: 28px;
    text-transform: uppercase;
  }
  .error {
    color: #ff7b7b; font-size: 13px;
    min-height: 18px; margin-bottom: 12px;
  }
  button {
    width: 100%; padding: 14px; font-size: 16px; font-weight: 600;
    color: #fff; background: #2563eb; border: none;
    border-radius: 12px; cursor: pointer;
    transition: background .2s;
  }
  button:hover { background: #1d4fd7; }
  button:disabled { background: #33465c; cursor: default; }

  /* Успешное подключение */
  .success {
    text-align: center; padding: 40px 20px;
  }
  .success .emoji { font-size: 64px; margin-bottom: 16px; }
  .success h2 { margin: 0 0 8px; font-size: 24px; }
  .success p { margin: 0; color: #8fa3b8; }
</style>
</head>
<body>
  <div class="card" id="form-card">
    <h1>Подключение к аватару</h1>
    <p class="subtitle">Введите имя — аватар поздоровается с вами</p>

    <label for="name">Ваше имя</label>
    <input type="text" id="name" maxlength="20" placeholder="Как вас зовут?" autocomplete="nickname">

    <label for="code">Код игры</label>
    <input type="text" id="code" class="code-input" maxlength="5" placeholder="XXXXX"
           autocapitalize="characters" spellcheck="false" value="{{ code }}">

    <div class="error" id="err"></div>
    <button id="btn">Войти</button>
  </div>

  <div class="card success" id="success-card" style="display:none">
    <div class="emoji">👋</div>
    <h2 id="success-name"></h2>
    <p>Аватар сейчас поздоровается с вами!</p>
  </div>

  <script>
    const nameInput = document.getElementById('name');
    const codeInput = document.getElementById('code');
    const errEl = document.getElementById('err');
    const btn = document.getElementById('btn');
    const formCard = document.getElementById('form-card');
    const successCard = document.getElementById('success-card');

    if (codeInput.value) nameInput.focus(); else codeInput.focus();

    async function go() {
      errEl.textContent = '';
      const code = codeInput.value.trim().toUpperCase();
      const name = nameInput.value.trim();

      if (!code) { errEl.textContent = 'Введите код игры'; codeInput.focus(); return; }
      if (!name) { errEl.textContent = 'Введите имя'; nameInput.focus(); return; }

      btn.disabled = true;
      btn.textContent = 'Подключаемся…';

      try {
        // 1. Обмен кода на токен
        const connRes = await fetch('/api/guest/connect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });
        const connData = await connRes.json();
        if (!connRes.ok) throw new Error(connData.error);

        // 2. Регистрация имени
        const joinRes = await fetch('/api/guest/join', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: connData.accessToken, name })
        });
        const joinData = await joinRes.json();
        if (!joinRes.ok) throw new Error(joinData.error);

        // 3. Показываем успех
        document.getElementById('success-name').textContent = `Привет, ${name}!`;
        formCard.style.display = 'none';
        successCard.style.display = 'block';
      } catch (e) {
        errEl.textContent = e.message;
        btn.disabled = false;
        btn.textContent = 'Войти';
      }
    }

    btn.addEventListener('click', go);
    [codeInput, nameInput].forEach(el => {
      el.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    });
  </script>
</body>
</html>
