<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Вход гостя</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:linear-gradient(160deg,#0b1626,#050a12);color:#e8eef5;
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:20px}
  .card{width:100%;max-width:400px;background:#0d1724;border:1px solid #1c2e42;border-radius:20px;padding:26px}
  h1{font-size:22px;margin-bottom:6px}
  .muted{color:#6d829a;font-size:14px;margin-bottom:18px}
  input{width:100%;background:#0a1420;border:1px solid #22384f;color:#e8eef5;border-radius:12px;
    padding:14px;font-size:17px;margin-bottom:10px}
  input.code{text-transform:uppercase;letter-spacing:.25em;text-align:center;font-weight:800}
  button{width:100%;background:#2563eb;color:#fff;border:0;border-radius:12px;padding:15px;
    font-size:17px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.55}
  .err{background:#3a1414;border:1px solid #6b2222;color:#f3a3a3;border-radius:10px;
    padding:10px;font-size:14px;margin-bottom:10px;display:none}
  .err.on{display:block}
  .ok{text-align:center}
  .ok .big{font-size:44px;margin-bottom:10px}
  .opt{width:100%;background:#12243a;border:1px solid #24405e;color:#e8eef5;border-radius:12px;
    padding:15px;font-size:17px;margin-bottom:9px;text-align:left;cursor:pointer}
  .opt.sel{border-color:#2563eb;background:#16305a}
  .hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <div id="err" class="err"></div>

  <div id="step-join">
    <h1 id="ev-title">Добро пожаловать!</h1>
    <div class="muted">Введите код с экрана и своё имя — ведущий поздоровается с вами лично.</div>
    <input id="code" class="code" maxlength="5" placeholder="КОД" value="{{ code }}" autocomplete="off">
    <input id="name" placeholder="Ваше имя" autocomplete="name">
    <input id="table" placeholder="Стол (необязательно)" autocomplete="off">
    <button id="btn" onclick="join()">Войти</button>
  </div>

  <div id="step-done" class="hidden ok">
    <div class="big">🎉</div>
    <h1 id="hello"></h1>
    <div class="muted" id="hint">Смотрите на экран — сейчас вас поприветствуют.</div>
    <div id="quiz" class="hidden">
      <h1 id="q-text" style="font-size:18px;margin:16px 0 12px"></h1>
      <div id="q-opts"></div>
      <div class="muted" id="q-status"></div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=localStorage.getItem('guestToken')||'';
function err(m){const e=$('err');if(!m){e.classList.remove('on');return;}e.textContent=m;e.classList.add('on');}

async function join(){
  err(''); $('btn').disabled=true;
  const code=$('code').value.trim().toUpperCase(), name=$('name').value.trim();
  if(!name){err('Введите имя');$('btn').disabled=false;return;}
  try{
    let r=await fetch('/api/guest/connect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
    let d=await r.json(); if(d.error){err(d.error);$('btn').disabled=false;return;}
    r=await fetch('/api/guest/join',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:d.accessToken,name,table:$('table').value.trim()})});
    d=await r.json(); if(d.error){err(d.error);$('btn').disabled=false;return;}
    token=d.accessToken; localStorage.setItem('guestToken',token);
    showDone(d.name);
  }catch(e){err('Нет связи с сервером');$('btn').disabled=false;}
}

function showDone(name){
  $('step-join').classList.add('hidden'); $('step-done').classList.remove('hidden');
  $('hello').textContent=`Привет, ${name}!`;
  poll(); setInterval(poll,3000);
}

let answered=null, quizId=null;
async function poll(){
  try{
    const r=await fetch('/api/guest/me?token='+encodeURIComponent(token));
    if(r.status===404){localStorage.removeItem('guestToken');location.reload();return;}
    const d=await r.json();
    const q=d.quiz;
    if(!q){$('quiz').classList.add('hidden');return;}
    if(q.id!==quizId){quizId=q.id;answered=null;}
    $('quiz').classList.remove('hidden');
    $('q-text').textContent=q.question;
    $('q-opts').innerHTML=q.options.map((o,i)=>
      `<button class="opt ${answered===i?'sel':''}" ${q.open?'':'disabled'} onclick="answer(${i})">${'АБВГД'[i]} — ${esc(o)}</button>`).join('');
    $('q-status').textContent=q.open?(answered!=null?'Ответ принят':'Выберите вариант'):
      (q.correct!=null?(answered===q.correct?'Верно! 🎉':`Правильный ответ: ${q.options[q.correct]}`):'Приём ответов закрыт');
  }catch(e){}
}
async function answer(i){
  answered=i; poll();
  const r=await fetch('/api/quiz/answer',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({token,index:i})});
  const d=await r.json(); if(d.error){err(d.error);answered=null;}
}

// уже заходили с этого телефона — восстанавливаем сессию
(async()=>{
  if(!token)return;
  const r=await fetch('/api/guest/me?token='+encodeURIComponent(token));
  if(r.ok){const d=await r.json();showDone(d.guest.name);}
  else localStorage.removeItem('guestToken');
})();
</script>
</body>
</html>
