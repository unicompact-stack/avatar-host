<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аватар-хост — тестовый режим</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#070d15;color:#e8eef5;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    padding:24px;max-width:760px;margin:0 auto}
  h1{font-size:22px;margin-bottom:4px}
  .muted{color:#6d829a;font-size:13px;margin-bottom:16px}
  textarea,select{width:100%;background:#0a1420;border:1px solid #22384f;color:#e8eef5;border-radius:10px;
    padding:12px;font-size:15px;font-family:inherit;margin-bottom:10px}
  textarea{min-height:110px}
  button{background:#2563eb;color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;margin:0 6px 6px 0}
  button.ghost{background:#152437;border:1px solid #26405c}
  video{width:100%;border-radius:12px;background:#000;margin-bottom:12px}
  .info{font-size:13px;color:#8fa9c4;margin-top:10px}
  a{color:#7fb0ff}
</style>
</head>
<body>
  <h1>Тестовый режим <span class="muted">v{{ build }}</span></h1>
  <div class="muted">Проверка синтеза и видео локально. Боевые экраны: <a href="/host">/host</a> и <a href="/admin">/admin</a>.</div>

  <video id="v" src="/static/videos/awaiting.mp4?v={{ build }}" autoplay loop muted playsinline></video>
  <textarea id="text" placeholder="Текст для озвучки">Привет! Меня зовут Аватар, и я рад с вами познакомиться.</textarea>
  <select id="voice">{% for v in voices %}<option value="{{ v.id }}">{{ v.label }}</option>{% endfor %}</select>
  <div>
    <button onclick="speak()">Озвучить локально</button>
    {% for p in presets %}<button class="ghost" onclick="document.getElementById('text').value=this.dataset.t" data-t="{{ p }}">{{ p[:24] }}…</button>{% endfor %}
  </div>
  <div class="info" id="info"></div>

<script>
const $=id=>document.getElementById(id);
let audio=null;
async function speak(){
  const text=$('text').value.trim(); if(!text)return;
  $('info').textContent='Синтезирую…';
  const r=await fetch('/api/tts/preview',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text,voice:$('voice').value})});
  const d=await r.json();
  if(d.error){$('info').textContent=d.error;return;}
  $('info').textContent=`движок: ${d.engine} · ${d.duration}s${d.note?' · '+d.note:''}`;
  $('v').src='/static/videos/speaking.mp4?v={{ build }}'; $('v').play();
  if(audio)audio.pause();
  audio=new Audio(d.url); audio.play().catch(()=>{$('info').textContent+=' · нажмите ещё раз (автозвук)';});
  audio.onended=()=>{ $('v').src='/static/videos/awaiting.mp4?v={{ build }}'; $('v').play(); };
}
</script>
</body>
</html>
